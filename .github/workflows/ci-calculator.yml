# CI pipeline for the Calculator project (Lab 5)
# Triggers: every push to main, and every pull request targeting main
name: CI Calculator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]          # build matrix: JDK 17 and JDK 21 in parallel
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven          # cache ~/.m2 to speed up repeated builds

      - name: Compile all Java sources
        run: mvn -B clean compile

      - name: Run JUnit 5 test suite
        run: mvn -B test
